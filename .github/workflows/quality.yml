name: Python quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Set up Python 3.10
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.10"
          cache: pip

      - name: Install development dependencies
        run: python -m pip install ".[dev]"

      - name: Run Python quality gate
        run: python scripts/quality.py

      - name: Validate Compose configuration
        env:
          WEBUI_SECRET_KEY_FILE: ${{ runner.temp }}/badminton-ai-webui-secret
        run: |
          python -c "from pathlib import Path; import os; Path(os.environ['WEBUI_SECRET_KEY_FILE']).write_text('ci-dummy-secret\\n', encoding='utf-8')"
          docker compose config --quiet
          python -c "from pathlib import Path; import os; Path(os.environ['WEBUI_SECRET_KEY_FILE']).unlink(missing_ok=True)"
