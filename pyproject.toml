[build-system]
requires = ["setuptools>=61,<70", "wheel>=0.38,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "badminton-ai"
version = "0.1.0"
description = "BadmintonAI v2 的羽球資料分析核心骨架"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.128.0",
    "markdown-it-py==4.2.0",
    "plotly==6.6.0",
    "pydantic>=2.8,<3",
    "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "matplotlib==3.9.4",
    "numpy==2.2.1",
    "pandas==2.2.3",
    "pytest>=8.0,<9",
]
dev = [
    "httpx>=0.27,<1",
    "matplotlib==3.9.4",
    "numpy==2.2.1",
    "pandas==2.2.3",
    "pytest>=8.0,<9",
    "ruff==0.16.8",
]

[project.scripts]
badminton-ai-tool-server = "badminton_ai.server.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src", "."]

[tool.ruff]
required-version = "==0.16.8"
target-version = "py310"
line-length = 88
extend-exclude = [
    "TODO.md",
    "docs",
    "build",
    "dist",
    ".venv",
    ".runtime",
    "runtime",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
